<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Tangerin</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="tangerin.png" sizes="128x128" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-box">
        <div class="login-header">
          <h1>
            <img src="tangerin_logo.webp" alt="Tangerin" class="logo-img" />
            Tangerin
          </h1>
          <p>Please login to continue</p>
        </div>

        <form class="login-form" id="loginForm">
          <div id="errorMessage" class="error-message"></div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="login-btn" id="loginBtn">
            🔐 Login
          </button>
        </form>
      </div>
    </div>

    <script>
      const loginForm = document.getElementById("loginForm");
      const passwordInput = document.getElementById("password");
      const loginBtn = document.getElementById("loginBtn");
      const errorMessage = document.getElementById("errorMessage");

      // Check if already logged in
      const token = localStorage.getItem("authToken");
      if (token) {
        // Verify token is still valid by making a test request
        fetch("/api/progress", {
          headers: {
            Authorization: `Bearer ${token}`,
          },
        })
          .then((response) => {
            if (response.ok) {
              // Token is valid, redirect to main page
              window.location.href = "/";
            } else {
              // Token is invalid, remove it
              localStorage.removeItem("authToken");
            }
          })
          .catch(() => {
            // Error checking token, remove it
            localStorage.removeItem("authToken");
          });
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const password = passwordInput.value;

        if (!password) {
          showError("Please enter a password");
          return;
        }

        // Disable button and show loading state
        loginBtn.disabled = true;
        loginBtn.textContent = "🔄 Logging in...";
        errorMessage.classList.remove("show");

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ password }),
          });

          const data = await response.json();

          if (response.ok && data.success) {
            // Store token in localStorage
            localStorage.setItem("authToken", data.token);

            // Redirect to main page
            window.location.href = "/";
          } else {
            showError(data.error || "Login failed. Please try again.");
            loginBtn.disabled = false;
            loginBtn.textContent = "🔐 Login";
          }
        } catch (error) {
          console.error("Login error:", error);
          showError("An error occurred. Please try again.");
          loginBtn.disabled = false;
          loginBtn.textContent = "🔐 Login";
        }
      });

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add("show");
      }
    </script>
  </body>
</html>
