<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tangerin - OCR to Audiobook Converter</title>
    <!-- Single consolidated stylesheet -->
    <link rel="stylesheet" href="styles.css" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="tangerin.png" sizes="128x128" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🍊 Tangerin</h1>
        <p>Transform your images into a complete audiobook</p>
      </header>

      <div class="main-content">
        <!-- Left Panel: Configuration -->
        <div class="left-panel">
          <div class="config-section">
            <h2>📖 Book Configuration</h2>

            <div class="input-group">
              <label for="bookTitle">Book Title:</label>
              <input
                type="text"
                id="bookTitle"
                placeholder="Enter book title..."
                value="Daniel In Babylon"
              />
            </div>

            <div class="input-group">
              <label for="voiceSelect">Voice Selection:</label>
              <select id="voiceSelect">
                <option>--- select a voice ---</option>
                <option value="alloy">Alloy</option>
                <option value="ash">Ash</option>
                <option value="ballad">Ballad</option>
                <option value="coral">Coral</option>
                <option value="echo">Echo</option>
                <option value="fable">Fable</option>
                <option value="nova">Nova</option>
                <option value="onyx">Onyx</option>
                <option value="sage">Sage</option>
                <option value="shimmer">Shimmer</option>
                <option value="verse">Verse</option>
              </select>
              <button id="playVoiceSample" class="btn success voice-sample-btn">
                🔊 Play Sample
              </button>
            </div>

            <div class="input-group">
              <label for="languageSelect"
                >Translation Language (Optional):</label
              >
              <select id="languageSelect">
                <option value="">--- no translation ---</option>
                <option value="spanish">Spanish</option>
                <option value="french">French</option>
                <option value="german">German</option>
                <option value="italian">Italian</option>
                <option value="portuguese">Portuguese</option>
                <option value="russian">Russian</option>
                <option value="japanese">Japanese</option>
                <option value="korean">Korean</option>
                <option value="chinese">Chinese</option>
                <option value="arabic">Arabic</option>
                <option value="hindi">Hindi</option>
                <option value="dutch">Dutch</option>
                <option value="swedish">Swedish</option>
                <option value="norwegian">Norwegian</option>
                <option value="danish">Danish</option>
                <option value="polish">Polish</option>
                <option value="turkish">Turkish</option>
                <option value="greek">Greek</option>
                <option value="hebrew">Hebrew</option>
                <option value="thai">Thai</option>
              </select>
            </div>

            <div class="images-section">
              <h3>📷 Images to Process</h3>
              <div id="imagesList" class="images-list">
                <div class="loading">Loading images...</div>
              </div>
              <div class="images-count">
                <span id="imagesCount">0</span> images found
              </div>
            </div>

            <div class="action-section">
              <button
                id="startTransformation"
                class="btn primary start-btn"
                disabled
              >
                🚀 Start Transformation
              </button>
            </div>
          </div>

          <!-- Progress Section -->
          <div class="progress-section">
            <h3>📊 Progress</h3>
            <div class="progress-bar-container">
              <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
              </div>
              <span id="progressText">0%</span>
            </div>

            <div class="progress-steps">
              <div class="step" id="step-ocr">
                <span class="step-icon">📖</span>
                <span class="step-text">OCR Processing</span>
                <span class="step-status">⏳</span>
              </div>
              <div class="step" id="step-combine">
                <span class="step-icon">📚</span>
                <span class="step-text">Text Combination</span>
                <span class="step-status">⏳</span>
              </div>
              <div class="step" id="step-clean">
                <span class="step-icon">🧹</span>
                <span class="step-text">AI Cleaning</span>
                <span class="step-status">⏳</span>
              </div>
              <div class="step" id="step-translate" style="display: none">
                <span class="step-icon">🌍</span>
                <span class="step-text">Translation</span>
                <span class="step-status">⏳</span>
              </div>
              <div class="step" id="step-tts">
                <span class="step-icon">🎤</span>
                <span class="step-text">Text-to-Speech</span>
                <span class="step-status">⏳</span>
              </div>
              <div class="step" id="step-complete">
                <span class="step-icon">🎉</span>
                <span class="step-text">Complete</span>
                <span class="step-status">⏳</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Audio Player for Voice Samples -->
      <audio id="voiceSamplePlayer" preload="none"></audio>
    </div>

    <script src="script.js"></script>
  </body>
</html>
