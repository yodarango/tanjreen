services:
  tanjreen:
    build: .
    container_name: tanjreen
    ports:
      - "8011:8011"
    environment:
      - PORT=8011
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PENDING_DIR=./src/content/1.pending
      - WORKING_DIR=./src/content/2.working
      - DONE_DIR=./src/content/3.done
      - TEXT_LANG=eng
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this-to-something-secure}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-Tanjreen2024}
      - API_KEY=${API_KEY:-}
      - API_REQUESTS_DIR=./src/content/api_requests
      - NODE_ENV=${NODE_ENV:-development}
      - TRANSFER_TO_PATH=${TRANSFER_TO_PATH:-}
    volumes:
      # Persist content directories
      - ./src/content:/app/src/content
      # Optional: mount .env file
      - ./.env:/app/.env:ro
      # Audiobookshelf library - step 7 copies finished MP3s here (TRANSFER_TO_PATH)
      - /var/www/repos/audiobookshelf/audiobooks:/var/www/repos/audiobookshelf/audiobooks
    restart: unless-stopped
    networks:
      - tanjreen-network

networks:
  tanjreen-network:
    driver: bridge
